name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate page
        env:
          # HOMELAB_TOKEN — PAT со scope `repo`, если страницу нужно обновлять
          # в Actions вместе с приватными репозиториями. Без него деплоится
          # уже закоммиченный index.html (сгенерированный локально).
          HOMELAB_TOKEN: ${{ secrets.HOMELAB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.HOMELAB_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: |
          if [ -n "$HOMELAB_TOKEN" ]; then
            node generate.js
          else
            echo "HOMELAB_TOKEN не задан — используется закоммиченный index.html"
          fi

      - name: Prepare artifact
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
